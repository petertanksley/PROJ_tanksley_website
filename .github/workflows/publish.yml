name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install pagedjs-cli (PDF engine for CV)
        run: npm install -g pagedjs-cli

      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), which
      # kills Chromium's sandbox: "No usable sandbox!" -> "Failed to launch the browser".
      - name: Allow Chromium sandbox on Ubuntu 24.04 runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
