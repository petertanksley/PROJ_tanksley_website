name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# A new push supersedes any run still in flight for this branch. Without this, a hung
# run (2026-08-28: npm install sat for 2.5 h) keeps spinning next to the fresh one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Normal end-to-end time is ~6-7 min. Fail loudly instead of idling until GitHub's
    # 6-hour default kills the job.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Puppeteer's postinstall normally downloads a bundled Chromium (~150 MB), which
      # stalled two runs on 2026-08-28. Skip the download entirely — the render step
      # points puppeteer at the runner's preinstalled Chrome instead. Retry loop kept
      # for ordinary npm-registry flakiness (both skip vars: puppeteer >=19 reads
      # PUPPETEER_SKIP_DOWNLOAD, older reads PUPPETEER_SKIP_CHROMIUM_DOWNLOAD).
      - name: Install pagedjs-cli (PDF engine for CV)
        timeout-minutes: 8
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
        run: |
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt"
            timeout 150 npm install -g pagedjs-cli && exit 0
            echo "attempt $attempt failed or stalled; retrying"
            npm cache clean --force >/dev/null 2>&1 || true
          done
          echo "pagedjs-cli install failed after 3 attempts"; exit 1

      # The render step hands this Chrome to puppeteer via PUPPETEER_EXECUTABLE_PATH.
      # Fail here, loudly, if the runner image ever drops it.
      - name: Verify runner Chrome exists
        run: /usr/bin/google-chrome --version

      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), which
      # kills Chromium's sandbox: "No usable sandbox!" -> "Failed to launch the browser".
      - name: Allow Chromium sandbox on Ubuntu 24.04 runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the runner's preinstalled Chrome; pairs with PUPPETEER_SKIP_DOWNLOAD above.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
